{% extends "staffpanel/base.html" %}
{% load widget_tweaks %}

{% block title %}Sửa nhân viên{% endblock %}
{% block nav_employee %}active{% endblock %}

{% block extra_css %}
<style>
    .form-container {
        max-width: 900px;
        margin: 0 auto;
    }

    .page-header {
        background: transparent;
        border: none;
        padding: 0 0 1.5rem 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
    }

    .page-header h4 {
        color: #374151;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 0.875rem;
        font-weight: 600;
        margin: 0;
    }

    .form-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 2rem;
    }

    .form-label {
        color: #374151;
        font-weight: 500;
        font-size: 0.9375rem;
        margin-bottom: 0.5rem;
    }

    .form-control, .form-select {
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 0.625rem 1rem;
        font-size: 0.9375rem;
        color: #374151;
        transition: all 0.2s;
    }

    .form-control::placeholder {
        color: #9ca3af;
    }

    .form-control:focus, .form-select:focus {
        border-color: #214134;
        box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
        outline: none;
    }

    .form-control[readonly] {
        background-color: #f9fafb;
        color: #6b7280;
    }

    .form-row {
        margin-bottom: 1.5rem;
    }

    .btn {
        border-radius: 8px;
        padding: 0.625rem 2rem;
        font-size: 0.9375rem;
        font-weight: 500;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
    }

    .btn-primary-custom {
        background-color: #214134 !important;
        color: white !important;
    }

    .btn-secondary-custom {
        background-color: #e5e7eb !important;
        color: #6b7280 !important;
    }

    .form-actions {
        margin-top: 2.5rem;
        padding-top: 2rem;
        border-top: 1px solid #e5e7eb;
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
    }

</style>
{% endblock %}


{% block content %}
<div class="form-container">

    <!-- Header -->
    <div class="page-header">
        <h4>SỬA NHÂN VIÊN</h4>

        <a href="{% url 'staff_employee_list' %}" class="btn btn-back">
            <i class="bi bi-arrow-left"></i> Quay lại
        </a>
    </div>

    <!-- Form Card -->
    <div class="form-card">
        <form method="post" novalidate>
            {% csrf_token %}

            <div class="row">

                <!-- Mã nhân viên -->
                <div class="col-md-6 form-row">
                    <label class="form-label">Mã nhân viên</label>
                    <input type="text" class="form-control" value="{{ nhanvien.MaNhanVien }}" readonly>
                </div>

                <!-- Username -->
                <div class="col-md-6 form-row">
                    <label class="form-label">Tên đăng nhập</label>
                    <input type="text" class="form-control" value="{{ nhanvien.user.username }}" readonly>
                </div>

                <!-- First name -->
                <div class="col-md-6 form-row">
                    <label class="form-label">Họ <span class="text-danger">*</span></label>
                    <input type="text" name="first_name" class="form-control" value="{{ nhanvien.user.first_name }}" required>
                </div>

                <!-- Last name -->
                <div class="col-md-6 form-row">
                    <label class="form-label">Tên <span class="text-danger">*</span></label>
                    <input type="text" name="last_name" class="form-control" value="{{ nhanvien.user.last_name }}" required>
                </div>

                <!-- Email -->
                <div class="col-md-6 form-row">
                    <label class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" name="email" class="form-control" value="{{ nhanvien.user.email }}" required>
                </div>

                <!-- Role -->
                <div class="col-md-6 form-row">
                    <label class="form-label">Vai trò <span class="text-danger">*</span></label>
                    <select name="vai_tro" class="form-select" required>
                        <option value="MANAGER" {% if nhanvien.VaiTro == 'MANAGER' %}selected{% endif %}>Quản lý</option>
                        <option value="CONTENT" {% if nhanvien.VaiTro == 'CONTENT' %}selected{% endif %}>Nhân viên nội dung</option>
                        <option value="RECEPTION" {% if nhanvien.VaiTro == 'RECEPTION' %}selected{% endif %}>Lễ tân</option>
                    </select>
                </div>

                <!-- Password -->
                <div class="col-md-12 form-row">
                    <label class="form-label">Đổi mật khẩu mới</label>
                    <input type="password" name="new_password" class="form-control" placeholder="Để trống nếu không đổi">
                </div>

            </div>

            <!-- BUTTONS -->
            <div class="form-actions">
                <a href="{% url 'staff_employee_list' %}" class="btn btn-secondary-custom">Hủy</a>
                <button type="submit" class="btn btn-primary-custom">
                    <i class="bi bi-check-circle"></i> Lưu thay đổi
                </button>
            </div>

        </form>
    </div>
</div>
{% endblock %}
